name: Trivy

on:
  push:
    branches: [main, master]
  # pull_request:
  # The branches below must be a subset of the branches above
  #   branches: [main, master]
  #   paths-ignore:
  #     - "**/*.md"
  #     - "**/*.txt"
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  analyze-config:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2

      - name: Run Trivy vulnerability scanner in repo mode
        uses: aquasecurity/trivy-action@062f2592684a31eb3aa050cc61e7ca1451cecd3d # v0.18.0
        with:
          scan-type: "config"
          format: "sarif"
          output: "trivy-results1.sarif"
          severity: "CRITICAL,HIGH" # While vulnerabilities of all severities are reported in the SARIF output, the exit code and workflow failure are triggered only by these specified severities (CRITICAL or HIGH).
          args: "--ignorefile .trivyignore"
          # ignore-unfixed: true
          hide-progress: false
          vuln-type: "os,library"
          exit-code: "1" # Trivy exits with code 1 if vulnerabilities are found, causing the workflow step to fail.
          limit-severities-for-sarif: true

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3.25.10
        if: always()
        with:
          sarif_file: "trivy-results1.sarif"

  analyze-discovery-finder:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2
        
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.2.2
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Build JAR
        run: mvn clean package
        
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@062f2592684a31eb3aa050cc61e7ca1451cecd3d # v0.18.0
        with:
          image-ref: "tractusx/sldt-discovery-finder:latest"
          format: "sarif"
          output: "trivy-results-discovery-finder.sarif"
          severity: "CRITICAL,HIGH" # While vulnerabilities of all severities are reported in the SARIF output, the exit code and workflow failure are triggered only by these specified severities (CRITICAL or HIGH).
          args: "--ignorefile .trivyignore"
          # ignore-unfixed: true
          hide-progress: false
          exit-code: "1" # Trivy exits with code 1 if vulnerabilities are found, causing the workflow step to fail.
          vuln-type: "os,library"
          limit-severities-for-sarif: true

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3.25.10
        if: always()
        with:
          sarif_file: "trivy-results-discovery-finder.sarif"