---

name: Public release discovery-finder
on:
  push:
    branches:
      - main
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

env:
  IMAGE_NAMESPACE: tractusx
  IMAGE_NAME: sldt-discovery-finder

jobs:
  build-image:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout if push
        if: ${{ github.event_name == 'push' }}
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2
      - name: Checkout if workflow_dispatch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2
        with:
          ref: ${{ inputs.tag }}
      - name: setup-java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.2.2
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Maven Action
        uses: s4u/setup-maven-action@2f53a7669c7543a045d0bb6c92436df0c5a726f8 # v1.14.0
        with:
          java-version: 17
      - name: execute-maven-deps
        working-directory: ./backend
        run: mvn verify dependency:list -DskipTests -Dmaven.javadoc.skip=true -DappendOutput=false -DoutputFile=maven.deps -DincludeScope=compile
      - name: install dependencies
        working-directory: ./.github/actions/generate-dependencies-notice
        run: npm install
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.5.1
        with:
          images: |
            ${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch,enable=${{ inputs.tag == '' }}
            type=semver,pattern={{version}},value=${{ inputs.tag }}
            type=semver,pattern={{major}},value=${{ inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }}
            type=raw,value=latest,enable=${{ inputs.tag != '' }}
      - name: DockerHub login
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.3.0
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.3.0
        with:
          context: .
          push: true
          file: ./backend/Dockerfile
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@432a30c9e07499fd01da9f8a49f0faf9e0ca5b77 # v4.0.0
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
          repository: ${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_NAME }}
          readme-filepath: ./backend/DOCKER_NOTICE.md